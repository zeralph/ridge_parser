<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Ridge Racer | Viewer de circuit</title>
		<script src="js/three.js?v=raycast-material"></script>
		<script src="js/orbit-controls.js"></script>
		<script src="Sceneview.js?v=smooth-fly"></script>
		<script src="MapDecode.js?v=map-fly"></script>
		<script src="RevolutionDecode.js?v=revolution-banks"></script>
		<script src="ObjDecode.js"></script>
		<script src="Rr4Decode.js?v=rr4-ambient"></script>
		<script src="MapVram.js?v=revolution-banks"></script>
		<script src="MapView.js?v=unified-controls"></script>
		<style>
			:root {
				color-scheme: dark;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #10191b;
				color: #e4efed;
			}
			* { box-sizing: border-box; }
			[hidden] { display: none !important; }
			body { margin: 0; min-height: 100vh; }
			main { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100vh; min-height: 0; overflow: hidden; }
			aside { overflow-y: auto; padding: 22px; background: #182527; border-right: 1px solid #304244; }
			h1 { margin: 0 0 22px; font-size: 19px; line-height: 1.25; }
			fieldset { display: grid; gap: 12px; margin: 0 0 18px; padding: 0; border: 0; }
			legend { margin-bottom: 12px; color: #8edbc9; font-size: 12px; font-weight: 700; text-transform: uppercase; }
			label { display: grid; gap: 5px; color: #b7c8c5; font-size: 12px; }
			#rr4FlyControls, #rr4RenderOptions, #mdlTextureControls, #mdlPlaneControls { display: grid; gap: 12px; }
			#rr4RawControls summary { color: #b7c8c5; cursor: pointer; font-size: 12px; }
			input, select, button { width: 100%; min-height: 36px; border: 1px solid #405557; border-radius: 4px; background: #10191b; color: #e4efed; font: inherit; }
			input, select { padding: 7px 9px; }
			input[type="file"] { min-height: auto; padding: 7px; font-size: 11px; }
			label.checkbox { display: flex; align-items: center; gap: 8px; }
			label.checkbox input { width: auto; min-height: auto; }
			button { cursor: pointer; border-color: #54bca8; background: #1d7568; font-weight: 650; }
			button:hover { background: #258d7d; }
			#status { min-height: 42px; margin: 16px 0 0; color: #9aafab; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-line; }
			#status[data-error="true"] { color: #ff9a86; }
			#container { min-width: 0; min-height: 0; height: 100%; background: #0a1012; }
			#container canvas { display: block; }
			@media (max-width: 700px) {
				main { grid-template-columns: 1fr; height: auto; min-height: 100vh; overflow: visible; }
				aside { border-right: 0; border-bottom: 1px solid #304244; }
				#container { height: 60vh; min-height: 60vh; }
			}
		</style>
	</head>
	<body>
		<main>
			<aside>
				<h1>Ridge Racer<br>Viewer de circuit</h1>
				<fieldset>
					<legend>1 · Jeu</legend>
					<label for="sourceMode">Jeu</label>
					<select id="sourceMode">
						<option value="mdl">Gran Turismo</option>
						<option value="map">Ridge Racer 1</option>
						<option value="revolution">Ridge Racer Revolution</option>
						<option value="rr4" selected>Ridge Racer Type 4</option>
					</select>
				</fieldset>
				<fieldset>
					<legend>2 · Circuit</legend>
					<label for="course">Circuit</label>
					<select id="course"></select>
				</fieldset>
				<fieldset id="renderControls">
					<legend>3 · Rendu</legend>
					<label for="renderMode">Mode</label>
					<select id="renderMode"></select>
					<div id="rr4RenderOptions" hidden>
						<label class="checkbox"><input id="rr4RoadVisible" type="checkbox"> Afficher le ruban routier approximatif</label>
						<label for="rr4Ambient">Ambiante du circuit et couleur de fond (RGB)</label>
						<input id="rr4Ambient" type="color" value="#000000">
						<p id="rr4AmbientSource">Charge un circuit pour lire sa couleur ambiante.</p>
						<label class="checkbox"><input id="rr4AmbientEnabled" type="checkbox"> Appliquer au décor texturé (approximation)</label>
					</div>
				</fieldset>
				<fieldset id="cameraControls">
					<legend>4 · Caméra</legend>
					<button id="topView" type="button">Vue de dessus</button>
					<div id="rr4FlyControls" hidden>
						<button id="rr4FlyToggle" type="button" aria-pressed="false" disabled>Démarrer le fly-through</button>
						<label for="rr4FlySpeed"><span>Vitesse : <output id="rr4FlySpeedValue">1600</output> unités/s</span></label>
						<input id="rr4FlySpeed" type="range" min="0" max="6000" step="50" value="1600">
						<label for="rr4FlyHeight"><span>Hauteur : <output id="rr4FlyHeightValue">100</output> unités</span></label>
						<input id="rr4FlyHeight" type="range" min="20" max="500" step="10" value="100">
						<label for="rr4FlyDirection">Sens de parcours</label>
						<select id="rr4FlyDirection">
							<option value="normal">Normal</option>
							<option value="inverse">Inverse</option>
						</select>
						<p id="flyStatus" role="status"></p>
					</div>
					<p>Double-clique sur le circuit pour y centrer la caméra.</p>
				</fieldset>
				<fieldset>
					<legend>5 · Informations</legend>
					<p id="status" role="status" aria-live="polite">Chargement du circuit...</p>
					<p id="mapWarning" hidden></p>
					<p id="buildingStatus" role="status"></p>
					<p id="rr4Status" role="status" hidden></p>
					<p id="rr4RenderStatus" role="status"></p>
					<p id="skyStatus" role="status"></p>
					<p id="persistenceStatus" role="status"></p>
					<div id="mdlTextureControls">
					<label for="tmsBank">Banque (MDL)</label>
					<select id="tmsBank">
						<option value="TEX0.TMS" selected>TEX0.TMS</option>
						<option value="TEX1.TMS">TEX1.TMS</option>
						<option value="TEX2.TMS">TEX2.TMS</option>
						<option value="TEX3.TMS">TEX3.TMS</option>
						<option value="TEX4.TMS">TEX4.TMS</option>
					</select>
					<label for="tmsImage">Bloc image</label>
					<input id="tmsImage" type="number" min="0" step="1" value="24">
					</div>
					<div id="mdlPlaneControls">
					<label for="tmsPlane">Page 4-bpp</label>
					<select id="tmsPlane">
						<option value="0" selected>Page 0</option>
						<option value="1">Page 1</option>
					</select>
					</div>
					<p id="textureStatus" role="status"></p>
					<details id="rr4RawControls" hidden>
						<summary>Extraire une ressource brute R4</summary>
						<label for="rr4ResourceId">Indice de ressource</label>
						<input id="rr4ResourceId" type="number" min="0" max="933" step="1" value="0">
						<button id="rr4Extract" type="button">Télécharger le chunk</button>
					</details>
				</fieldset>
			</aside>
			<div id="container"></div>
		</main>
		<script>
			var m_viewer;
			var m_object;
			var m_buffer;
			var m_sourceName = "";
			var m_triangleObjects = [];
			var m_tmsTexture = null;
			var m_tmsBankName = "";
			var m_tmsBuffer = null;
			var m_tmsImages = [];
			var m_sourceType = "";
			var m_mapSectors = null;
			var m_mapIndexBuffer = null;
			var m_revolutionVram = null;
			var m_revolutionBuildings = null;
			var m_rr4Resources = null;
			var m_rr4Textures = [];
			var m_rr4RoadOverride = null;
			var m_textureRequest = 0;
			var m_mapTextures = [];
			var m_sourceRequest = 0;
			var m_lastRr4RenderMode = "textured";
			var m_lastGenericRenderMode = "textureSun";
			var m_activeCourse = null;
			var m_initialCourse = null;
			var m_cameraSuspended = false;
			var m_cameraSaveTimer = null;
			var m_modePaths = { mdl: "DESERT.MDL", map: "ridge_racer/MAP.RRM",
				rr4: "ridge_racer_4/R4.BIN" };
			var m_courses = {
				mdl: [["desert", "Desert"]],
				map: [["main", "Circuit principal"]],
				revolution: [["CRS_EASY.DAT", "Easy"], ["CRS_MID.DAT", "Mid"], ["CRS_HIGH.DAT", "High"],
					["CRS_OLDE.DAT", "Old Easy"], ["CRS_OLDH.DAT", "Old High"]],
				rr4: Array.from({ length: 8 }, function(_, index) { return [String(index), "Circuit " + (index + 1)]; })
			};

			function persistenceWarning(message) {
				document.getElementById("persistenceStatus").textContent = message;
			}

			function rawCookie(name) {
				var prefix = name + "=";
				var entry = document.cookie.split(/;\s*/).find(function(item) { return item.indexOf(prefix) === 0; });
				return entry ? entry.slice(prefix.length) : null;
			}

			function readViewerCookie(name) {
				try {
					var value = rawCookie(name);
					return value === null ? null : JSON.parse(decodeURIComponent(value));
				} catch (error) {
					persistenceWarning("Impossible de lire les préférences enregistrées : " + error.message);
					return null;
				}
			}

			function writeViewerCookie(name, value) {
				try {
					var encoded = encodeURIComponent(JSON.stringify(value));
					if (rawCookie(name) === encoded)
						return;
					document.cookie = name + "=" + encoded + "; Max-Age=31536000; Path=/; SameSite=Lax";
					if (rawCookie(name) !== encoded)
						throw new Error("cookies refusés par le navigateur");
				} catch (error) {
					persistenceWarning("Impossible d'enregistrer les préférences : " + error.message);
				}
			}

			function cameraCookieName(mode, course) {
				return "ridge_view_camera_" + mode + "_" + course;
			}

			function readStoredSelection() {
				var saved = readViewerCookie("ridge_view_selection");
				if (saved === null)
					return null;
				if (!saved || typeof saved.mode !== "string" || typeof saved.course !== "string" ||
					!Object.prototype.hasOwnProperty.call(m_courses, saved.mode) ||
					!m_courses[saved.mode].some(function(entry) { return entry[0] === saved.course; })) {
					persistenceWarning("Jeu ou circuit enregistré invalide.");
					return null;
				}
				return saved;
			}

			function saveActiveCamera() {
				if (!m_activeCourse || m_cameraSuspended)
					return;
				var camera = m_viewer.camera;
				var fly = m_viewer.rr4Fly;
				var target = fly && fly.active ? fly.target : m_viewer.controls.target;
				if (!target)
					return;
				writeViewerCookie(cameraCookieName(m_activeCourse.mode, m_activeCourse.course), {
					position: camera.position.toArray(), target: target.toArray(), near: camera.near, far: camera.far
				});
			}

			function scheduleCameraSave() {
				if (m_cameraSuspended || !m_activeCourse)
					return;
				clearTimeout(m_cameraSaveTimer);
				m_cameraSaveTimer = setTimeout(saveActiveCamera, 500);
			}

			function restoreCamera(mode, course) {
				var saved = readViewerCookie(cameraCookieName(mode, course));
				if (saved === null)
					return;
				function vector(value) {
					return Array.isArray(value) && value.length === 3 && value.every(Number.isFinite);
				}
				var distanceSquared = saved && vector(saved.position) && vector(saved.target) ?
					saved.position.reduce(function(sum, value, index) {
						return sum + Math.pow(value - saved.target[index], 2);
					}, 0) : NaN;
				if (!saved || !vector(saved.position) || !vector(saved.target) ||
					!Number.isFinite(saved.near) || !Number.isFinite(saved.far) ||
					saved.near <= 0 || saved.far <= saved.near ||
					!Number.isFinite(saved.near + saved.far) || !Number.isFinite(saved.near * saved.far) ||
					!Number.isFinite(distanceSquared) || distanceSquared <= 0) {
					persistenceWarning("Position de caméra enregistrée invalide pour ce circuit.");
					return;
				}
				m_viewer.camera.position.fromArray(saved.position);
				m_viewer.camera.up.set(0, 1, 0);
				m_viewer.camera.near = saved.near;
				m_viewer.camera.far = saved.far;
				m_viewer.camera.updateProjectionMatrix();
				m_viewer.controls.target.fromArray(saved.target);
				m_viewer.viewMode = "orbit";
				m_viewer.controls.update();
			}

			function showCourse(mode, course, render) {
				saveActiveCamera();
				m_cameraSuspended = true;
				try {
					if (!render())
						return false;
					m_activeCourse = { mode: mode, course: course };
					restoreCamera(mode, course);
					writeViewerCookie("ridge_view_selection", m_activeCourse);
					return true;
				} finally {
					m_cameraSuspended = false;
				}
			}

			function setSelectOptions(select, options, value) {
				select.replaceChildren();
				options.forEach(function(entry) {
					var option = document.createElement("option");
					option.value = entry[0];
					option.textContent = entry[1];
					select.appendChild(option);
				});
				select.value = value;
			}

			function disposeMeshMaterial(material) {
				if (!material)
					return;
				if (material instanceof THREE.MultiMaterial) {
					material.materials.forEach(function(item) { item.dispose(); });
				} else {
					material.dispose();
				}
			}

			function setStatus(message, isError) {
				var status = document.getElementById("status");
				status.textContent = message;
				status.dataset.error = isError ? "true" : "false";
			}

			function triangleQuality(a, b, c) {
				var edgeAB = new THREE.Vector3().subVectors(b, a);
				var edgeAC = new THREE.Vector3().subVectors(c, a);
				var cross = new THREE.Vector3().crossVectors(edgeAB, edgeAC);
				var doubledArea = cross.length();
				if (doubledArea < 1e-8)
					return Infinity;
				var edgeSum = a.distanceToSquared(b) + b.distanceToSquared(c) + c.distanceToSquared(a);
				return edgeSum / (Math.sqrt(3) * doubledArea);
			}

			function applyRenderMode() {
				var request = ++m_textureRequest;
				var mode = document.getElementById("renderMode").value;
				var textured = mode === "texture" || mode === "textureSun";
				document.getElementById("mdlTextureControls").hidden = !textured || m_sourceType !== "mdl";
				document.getElementById("mdlPlaneControls").hidden = !textured || m_sourceType !== "mdl";
				if (textured) {
					if (m_sourceType === "map" || m_sourceType === "revolution")
						applyMapTextures(request);
					else
						applyTmsTexture(request);
					return;
				}
				document.getElementById("textureStatus").textContent = "";
				if (m_tmsTexture) {
					m_tmsTexture.dispose();
					m_tmsTexture = null;
				}
				m_mapTextures.forEach(function(texture) { texture.dispose(); });
				m_mapTextures = [];
				var sunlightDirection = new THREE.Vector3(-0.5, 1, 0.35).normalize();
				m_triangleObjects.forEach(function(mesh) {
					var color = mesh.userData.blockColor;
					disposeMeshMaterial(mesh.material);
					if (mode === "wireframe") {
						mesh.material = new THREE.MeshBasicMaterial({ color: 0xd8e5e3, wireframe: true, side: THREE.DoubleSide });
					} else if (mode === "sun") {
						mesh.material = new THREE.MeshLambertMaterial({ color: 0xc8ccce, side: THREE.DoubleSide, flatShading: false });
					} else if (mode === "vertex") {
						mesh.geometry.faces.forEach(function(face) {
							face.vertexColors = face.vertexNormals.map(function(normal) {
								var light = 0.28 + 0.72 * Math.max(0, normal.dot(sunlightDirection));
								return color.clone().multiplyScalar(light);
							});
						});
						mesh.geometry.colorsNeedUpdate = true;
						mesh.material = new THREE.MeshBasicMaterial({ color: 0xffffff, vertexColors: THREE.VertexColors, side: THREE.DoubleSide });
					} else {
						mesh.material = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
					}
				});
				if (m_object && m_object.userData.summary) {
					var suffix = mode === "vertex" ? " · couleurs par sommet calculées depuis les normales; aucun stream couleur décodé pour les meshes" : "";
					setStatus(m_object.userData.summary + suffix, false);
				}
			}

			function readTmsImages(buffer) {
				var data = new DataView(buffer);
				var images = [];
				var position = 0;
				var recordIndex = 0;
				while (position + 8 <= data.byteLength) {
					if (data.getUint32(position, true) !== 16) {
						position += 4;
						continue;
					}
					var flags = data.getUint32(position + 4, true);
					if (flags > 15) {
						position += 4;
						continue;
					}
					var block = position + 8;
					var clut = null;
					var clutX = 0;
					var clutY = 0;
					if (flags & 8) {
						if (block + 12 > data.byteLength)
							break;
						var paletteSize = data.getUint32(block, true);
						if (paletteSize < 12 || block + paletteSize > data.byteLength)
							break;
						var paletteCount = Math.min(16, Math.floor((paletteSize - 12) / 2));
						clutX = data.getUint16(block + 4, true);
						clutY = data.getUint16(block + 6, true);
						clut = [];
						for (var paletteIndex = 0; paletteIndex < paletteCount; paletteIndex++)
							clut.push(data.getUint16(block + 12 + paletteIndex * 2, true));
						block += paletteSize;
					}
					if (block + 12 > data.byteLength)
						break;
					var blockSize = data.getUint32(block, true);
					if (blockSize < 12 || block + blockSize > data.byteLength)
						break;
					var widthWords = data.getUint16(block + 8, true);
					var height = data.getUint16(block + 10, true);
					var planeBytes = widthWords * height * 2;
					var payloadSize = blockSize - 12;
					if ((flags & 7) === 0 && clut && clut.length === 16 && widthWords && height && planeBytes && payloadSize % planeBytes === 0)
						images.push({ index: recordIndex, x: data.getUint16(block + 4, true), y: data.getUint16(block + 6, true), clutX: clutX, clutY: clutY, widthWords: widthWords, width: widthWords * 4, height: height, planeBytes: planeBytes, planeCount: payloadSize / planeBytes, pixels: block + 12, clut: clut });
					position = block + blockSize;
					recordIndex++;
				}
				return images;
			}

			function createTmsTexture(buffer, image, planeIndex) {
					if (!Number.isInteger(planeIndex) || planeIndex < 0 || planeIndex >= image.planeCount)
						throw new Error("Page 4-bpp absente de ce bloc image.");
					var packedPixels = new Uint8Array(buffer, image.pixels + planeIndex * image.planeBytes, image.planeBytes);
					var textureData = new Uint8Array(image.width * image.height * 4);
					for (var y = 0; y < image.height; y++) {
						for (var x = 0; x < image.width; x++) {
							var wordOffset = y * image.widthWords * 2 + Math.floor(x / 4) * 2;
							var word = packedPixels[wordOffset] | (packedPixels[wordOffset + 1] << 8);
							var color = image.clut[(word >> ((x % 4) * 4)) & 0x0F];
							var pixel = (y * image.width + x) * 4;
							textureData[pixel] = Math.round((color & 0x1F) * 255 / 31);
							textureData[pixel + 1] = Math.round(((color >> 5) & 0x1F) * 255 / 31);
							textureData[pixel + 2] = Math.round(((color >> 10) & 0x1F) * 255 / 31);
							textureData[pixel + 3] = color === 0 ? 0 : 255;
						}
					}
					var texture = new THREE.DataTexture(textureData, image.width, image.height, THREE.RGBAFormat, THREE.UnsignedByteType);
					texture.wrapS = THREE.ClampToEdgeWrapping;
					texture.wrapT = THREE.ClampToEdgeWrapping;
					texture.magFilter = THREE.NearestFilter;
					texture.minFilter = THREE.NearestFilter;
					texture.generateMipmaps = false;
					texture.flipY = false;
					texture.needsUpdate = true;
					return texture;
			}

			async function applyTmsTexture(request) {
				try {
					if (!m_triangleObjects.length)
						throw new Error("Charge un fichier MDL avant la texture.");
					var bank = document.getElementById("tmsBank").value;
					if (bank !== m_tmsBankName) {
						var response = await fetch("ridge_racer/" + bank);
						if (!response.ok)
							throw new Error("Impossible de charger " + bank + ".");
						var buffer = await response.arrayBuffer();
						if (request !== m_textureRequest)
							return;
						m_tmsBuffer = buffer;
						m_tmsImages = readTmsImages(buffer);
						m_tmsBankName = bank;
					}
					var imageIndex = Number(document.getElementById("tmsImage").value);
					var image = m_tmsImages.find(function(candidate) { return candidate.index === imageIndex; });
					if (!image)
						throw new Error("Bloc image TMS introuvable ou non décodable.");
					var planeIndex = Number(document.getElementById("tmsPlane").value);
					var texture = createTmsTexture(m_tmsBuffer, image, planeIndex);
					var powerOfTwo = (image.width & (image.width - 1)) === 0 && (image.height & (image.height - 1)) === 0;
					texture.wrapS = powerOfTwo ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
					texture.wrapT = powerOfTwo ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
					texture.minFilter = THREE.LinearFilter;
					var outsideCount = 0;
					var uvCount = 0;
					m_triangleObjects.forEach(function(mesh) {
						var geometry = mesh.geometry;
						geometry.faceVertexUvs[0] = geometry.faces.map(function(face, faceIndex) {
							var faceUvs = mesh.userData.uvFacePixels[faceIndex];
							faceUvs.forEach(function(uv) {
								if (uv[0] >= image.width || uv[1] >= image.height)
									outsideCount++;
								uvCount++;
							});
							return faceUvs.map(function(uv) { return new THREE.Vector2(uv[0] / image.width, uv[1] / image.height); });
						});
						geometry.uvsNeedUpdate = true;
						geometry.__directGeometry = undefined;
						disposeMeshMaterial(mesh.material);
						var Material = document.getElementById("renderMode").value === "textureSun" ? THREE.MeshLambertMaterial : THREE.MeshBasicMaterial;
						mesh.material = new Material({ map: texture, color: 0xffffff, side: THREE.DoubleSide });
					});
					if (m_tmsTexture)
						m_tmsTexture.dispose();
					m_tmsTexture = texture;
					m_mapTextures.forEach(function(oldTexture) { oldTexture.dispose(); });
					m_mapTextures = [];
					document.getElementById("textureStatus").textContent = bank + " #" + imageIndex + " page " + planeIndex + " · PS1 4-bpp RGB555 · " + image.width + "×" + image.height + " · " + (uvCount - outsideCount) + "/" + uvCount + " coins UV dans la page";
					if (m_object && m_object.userData.summary)
						setStatus(m_object.userData.summary + " · texture " + bank + " #" + imageIndex, false);
				} catch (error) {
					if (request === m_textureRequest) {
						document.getElementById("textureStatus").textContent = error.message;
						setStatus(error.message, true);
					}
				}
			}

			function getMdlPrimitiveEnd(data, primitiveOffset, primitiveCount) {
				var nextHeader = Infinity;
				for (var objectId = 0; objectId < 128; objectId++) {
					var headerAddress = data.getUint32(objectId * 4, false);
					if (!headerAddress)
						continue;
					var headerOffset = headerAddress - 0x06048000;
					if (headerOffset > primitiveOffset && headerOffset < nextHeader && headerOffset + 12 <= data.byteLength)
						nextHeader = headerOffset;
				}
				if (nextHeader !== Infinity)
					return nextHeader;
				return Math.min(data.byteLength, primitiveOffset + primitiveCount * 12);
			}

			function decodeMdlPrimitives(data, objectData) {
				var records = [];
				var position = objectData.primitiveOffset;
				for (var primitiveIndex = 0; primitiveIndex < objectData.primitiveCount; primitiveIndex++) {
					var remainingRecords = objectData.primitiveCount - primitiveIndex - 1;
					var record = null;
					for (var arity = 4; arity >= 3; arity--) {
						var nextPosition = position + 4 + arity * 2;
						var remainingBytes = objectData.primitiveEnd - nextPosition;
						if (nextPosition > objectData.primitiveEnd || remainingBytes < remainingRecords * 10 || remainingBytes > remainingRecords * 12 + 2)
							continue;

						var references = [];
						var valid = true;
						for (var referenceIndex = 0; referenceIndex < arity; referenceIndex++) {
							var reference = data.getUint16(position + 4 + referenceIndex * 2, false);
							if (reference % 16 !== 0 || reference / 16 >= objectData.vertexCount) {
								valid = false;
								break;
							}
							references.push(reference / 16);
						}
						if (!valid)
							continue;

						record = {
							indices: references,
							uvCorners: [
								[data.getUint8(position), data.getUint8(position + 1)],
								[data.getUint8(position + 2), data.getUint8(position + 3)]
							]
						};
						position = nextPosition;
						break;
					}
					if (!record)
						throw new Error("Primitive illisible pour l'objet " + objectData.id + " à l'index " + primitiveIndex + ".");
					records.push(record);
				}

				var padding = objectData.primitiveEnd - position;
				if (padding < 0 || padding > 2)
					throw new Error("Fin de bloc primitive inattendue pour l'objet " + objectData.id + ".");
				return records;
			}

			function renderMdlObjects(objects) {
				var group = new THREE.Object3D();
				var minimum = new THREE.Vector3(Infinity, Infinity, Infinity);
				var maximum = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
				var data = new DataView(m_buffer);
				var totalVertices = 0;
				var quadCount = 0;
				var triangleCount = 0;
				m_triangleObjects = [];

				objects.forEach(function(objectData) {
					var meshGeometry = new THREE.Geometry();
					var color = new THREE.Color();
					color.setHSL((objectData.id * 0.61803398875) % 1, 0.72, 0.56);
					for (var index = 0; index < objectData.vertexCount; index++) {
						var position = objectData.vertexOffset + index * 6;
						var x = data.getInt16(position, false);
						var y = data.getInt16(position + 2, false);
						var z = data.getInt16(position + 4, false);
						var vertex = new THREE.Vector3(x, y, z);
						meshGeometry.vertices.push(vertex.clone());
						minimum.x = Math.min(minimum.x, x);
						minimum.y = Math.min(minimum.y, y);
						minimum.z = Math.min(minimum.z, z);
						maximum.x = Math.max(maximum.x, x);
						maximum.y = Math.max(maximum.y, y);
						maximum.z = Math.max(maximum.z, z);
					}

					var primitiveRecords = decodeMdlPrimitives(data, objectData);
					var uvFacePixels = [];
					var addFace = function(a, b, c, uvByVertex) {
						meshGeometry.faces.push(new THREE.Face3(a, b, c));
						uvFacePixels.push([uvByVertex[a], uvByVertex[b], uvByVertex[c]].map(function(uv) { return uv.slice(); }));
					};
					primitiveRecords.forEach(function(record) {
						var references = record.indices;
						var uv0 = record.uvCorners[0];
						var uv1 = record.uvCorners[1];
						var uvByVertex = {};
						uvByVertex[references[0]] = uv0;
						uvByVertex[references[1]] = [uv1[0], uv0[1]];
						if (references.length === 4) {
							uvByVertex[references[2]] = uv1;
							uvByVertex[references[3]] = [uv0[0], uv1[1]];
						} else {
							uvByVertex[references[2]] = uv1;
						}
						if (references.length === 4) {
							var vertexA = meshGeometry.vertices[references[0]];
							var vertexB = meshGeometry.vertices[references[1]];
							var vertexC = meshGeometry.vertices[references[2]];
							var vertexD = meshGeometry.vertices[references[3]];
							var qualityAC = Math.max(triangleQuality(vertexA, vertexB, vertexC), triangleQuality(vertexA, vertexC, vertexD));
							var qualityBD = Math.max(triangleQuality(vertexA, vertexB, vertexD), triangleQuality(vertexB, vertexC, vertexD));
							if (qualityAC <= qualityBD) {
								addFace(references[0], references[1], references[2], uvByVertex);
								addFace(references[0], references[2], references[3], uvByVertex);
							} else {
								addFace(references[0], references[1], references[3], uvByVertex);
								addFace(references[1], references[2], references[3], uvByVertex);
							}
							quadCount++;
						} else {
							addFace(references[0], references[1], references[2], uvByVertex);
							triangleCount++;
						}
					});

					meshGeometry.computeFaceNormals();
					meshGeometry.computeVertexNormals();
					meshGeometry.computeBoundingSphere();
					var material = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
					var mesh = new THREE.Mesh(meshGeometry, material);
					mesh.userData.blockColor = color.clone();
					mesh.userData.uvFacePixels = uvFacePixels;
					m_triangleObjects.push(mesh);
					group.add(mesh);
					totalVertices += objectData.vertexCount;
				});

				if (group.children.length === 0)
					throw new Error("Aucun objet MDL valide trouvé.");
				group.userData.vertexCount = totalVertices;
				group.userData.objectCount = objects.length;
				group.userData.faceCount = quadCount * 2 + triangleCount;
				group.userData.minimum = minimum.clone();
				group.userData.maximum = maximum.clone();
				var blockLabel = objects.length === 1 ? "objet" : objects.length + " blocs";
				group.userData.summary = m_sourceName + " · " + blockLabel + " · " + totalVertices + " vertices · " +
					quadCount + " quads · " + triangleCount + " triangles · " + (quadCount * 2 + triangleCount) + " faces";
				if (m_object)
					m_viewer.remove(m_object);
				m_object = group;
				m_viewer.scene.add(group);

				m_viewer.fitToBounds(minimum, maximum);
				applyRenderMode();
				setStatus(group.userData.summary, false);
			}

			function loadMdlCircuit() {
				if (!m_buffer)
					return setStatus("Charge d'abord un fichier MDL.", true);
				try {
					var data = new DataView(m_buffer);
					var addressBase = 0x06048000;
					var objects = [];
					var totalVertices = 0;
					var totalPrimitives = 0;
					for (var objectId = 0; objectId < 128; objectId++) {
						var headerOffset = data.getUint32(objectId * 4, false) - addressBase;
						if (headerOffset < 0 || headerOffset + 12 > data.byteLength)
							continue;
						var vertexCount = data.getUint16(headerOffset, false);
						var primitiveCount = data.getUint16(headerOffset + 2, false);
						var vertexOffset = data.getUint32(headerOffset + 4, false) - addressBase;
						var primitiveOffset = data.getUint32(headerOffset + 8, false) - addressBase;
						var primitiveEnd = getMdlPrimitiveEnd(data, primitiveOffset, primitiveCount);
						if (!vertexCount || vertexOffset < 0 || vertexOffset + vertexCount * 6 > data.byteLength)
							continue;
						if (primitiveCount && (primitiveOffset < 0 || primitiveEnd - primitiveOffset < primitiveCount * 10 || primitiveEnd > data.byteLength))
							continue;
						objects.push({ id: objectId, vertexOffset: vertexOffset, vertexCount: vertexCount, primitiveOffset: primitiveOffset, primitiveCount: primitiveCount, primitiveEnd: primitiveEnd });
						totalVertices += vertexCount;
						totalPrimitives += primitiveCount;
					}
					if (!objects.length)
						throw new Error("Aucun objet MDL valide trouvé.");

					m_sourceName = "Circuit complet";
					renderMdlObjects(objects);
					return true;
				} catch (error) {
					setStatus(error.message, true);
					return false;
				}
			}

			async function loadSource(buffer, name, request, mode) {
				if (mode === "rr4" && /\.BIN$/i.test(name)) {
					var resources = Rr4Decode.parse(buffer);
					if (request !== m_sourceRequest || mode !== document.getElementById("sourceMode").value)
						return;
					m_textureRequest++;
					m_buffer = buffer;
					m_mapSectors = null;
					m_rr4Resources = resources;
					m_sourceType = "rr4";
					document.getElementById("rr4ResourceId").max = resources.length - 1;
					document.getElementById("rr4Status").textContent = resources.length + " ressources indexées dans R4.BIN. Sélectionne un indice pour extraire son secteur.";
					showCourse(mode, document.getElementById("course").value, loadRr4Course);
				} else if (mode === "revolution" && /\.DAT$/i.test(name)) {
					var courseName = name.split(/[\\/]/).pop().toUpperCase();
					var pctName = RevolutionDecode.courses[courseName];
					if (!pctName)
						throw new Error("Circuit Revolution non reconnu : " + courseName + ".");
					var course = RevolutionDecode.parse(buffer);
					var pctResponse = await fetch("ridge_racer_revolution/" + pctName);
					if (!pctResponse.ok)
						throw new Error("Impossible de charger " + pctName + " (HTTP " + pctResponse.status + ").");
					var pctBuffer = await pctResponse.arrayBuffer();
					if (request !== m_sourceRequest || mode !== document.getElementById("sourceMode").value)
						return;
					var revolutionVram = {
						objects: MapVram.loadRevolution(buffer, course.textureOffset, pctBuffer),
						map: MapVram.loadRevolution(buffer, course.textureOffset + 0x30000, pctBuffer)
					};
					m_textureRequest++;
					m_buffer = buffer;
					m_mapSectors = course.sectors;
					m_revolutionVram = revolutionVram;
					m_revolutionBuildings = course.buildings;
					m_sourceType = "revolution";
					showCourse(mode, courseName, loadMapSelection);
				} else if (mode === "map" && /\.RRM$/i.test(name)) {
					var sectors = MapDecode.parse(buffer);
					var indexResponse = await fetch("ridge_racer/IDX.HED");
					if (!indexResponse.ok)
						throw new Error("Impossible de charger IDX.HED : HTTP " + indexResponse.status + ".");
					var indexBuffer = await indexResponse.arrayBuffer();
					if (request !== m_sourceRequest || mode !== document.getElementById("sourceMode").value)
						return;
					sectors = MapDecode.placeSections(sectors, indexBuffer);
					m_textureRequest++;
					m_buffer = buffer;
					m_mapSectors = sectors;
					m_mapIndexBuffer = indexBuffer;
					m_sourceType = "map";
					showCourse(mode, "main", loadMapSelection);
				} else if (mode === "mdl" && /\.MDL$/i.test(name)) {
					m_textureRequest++;
					m_buffer = buffer;
					m_mapSectors = null;
					m_rr4Resources = null;
					m_sourceType = "mdl";
					showCourse(mode, "desert", loadMdlCircuit);
				} else {
					var message = mode === "mdl" ? "Gran Turismo accepte uniquement les fichiers .MDL." :
						mode === "rr4" ? "Ridge Racer Type 4 accepte uniquement l'archive R4.BIN." :
						mode === "revolution" ? "Ridge Racer Revolution accepte uniquement les fichiers CRS_*.DAT pris en charge." :
						"Ridge Racer 1 accepte uniquement les fichiers .RRM.";
					throw new Error(message);
				}
			}

			function loadRr4Sky(layers, textureBuffer) {
				m_viewer.clearSky();
				var skyStatus = document.getElementById("skyStatus");
				try {
					var vram = MapVram.loadRr4(textureBuffer);
					var pages = new Map();
					layers.forEach(function(layer) {
						layer.primitives.forEach(function(primitive) {
							if (!primitive.uvs.length)
								return;
							var key = rr4TextureKey(primitive);
							if (!pages.has(key))
								pages.set(key, MapVram.page(vram, primitive.tpage, primitive.clut));
							if (!MapVram.covered(pages.get(key), primitive.uvs))
								throw new Error("Texture du ciel R4 incomplète : " + key + ".");
						});
					});
					var scene = new THREE.Scene();
					layers.forEach(function(layer, layerIndex) {
						var groups = new Map();
						layer.primitives.forEach(function(primitive) {
							var textured = primitive.uvs.length > 0;
							var key = textured ? rr4TextureKey(primitive) : "color";
							if (!groups.has(key))
								groups.set(key, { geometry: new THREE.Geometry(), textured: textured });
							var geometry = groups.get(key).geometry;
							var base = geometry.vertices.length;
							primitive.indices.forEach(function(index) {
								var vertex = layer.vertices[index];
								var coordinates = Rr4Decode.worldVertex(vertex[0], vertex[1], vertex[2]);
								geometry.vertices.push(new THREE.Vector3(coordinates[0] / 256, coordinates[1] / 256, coordinates[2] / 256));
							});
							var triangles = primitive.indices.length === 4 ? [[0, 1, 2], [1, 3, 2]] : [[0, 1, 2]];
							triangles.forEach(function(indices) {
								var face = new THREE.Face3(base + indices[0], base + indices[1], base + indices[2]);
								face.vertexColors = indices.map(function(index) {
									var color = primitive.colors[index], divisor = textured ? 128 : 255;
									return new THREE.Color(color[0] / divisor, color[1] / divisor, color[2] / divisor);
								});
								geometry.faces.push(face);
								if (textured)
									geometry.faceVertexUvs[0].push(indices.map(function(index) {
										var uv = primitive.uvs[index];
										return new THREE.Vector2((uv[0] + 0.5) / 256, (uv[1] + 0.5) / 256);
									}));
							});
						});
						groups.forEach(function(group, key) {
							var options = { side: THREE.DoubleSide, vertexColors: THREE.VertexColors, depthTest: false, depthWrite: false };
							if (group.textured) {
								var texture = new THREE.DataTexture(pages.get(key).pixels, 256, 256, THREE.RGBAFormat, THREE.UnsignedByteType);
								texture.magFilter = THREE.NearestFilter;
								texture.minFilter = THREE.NearestFilter;
								texture.generateMipmaps = false;
								texture.flipY = false;
								texture.needsUpdate = true;
								options.map = texture;
								options.alphaTest = 0.5;
							}
							var mesh = new THREE.Mesh(group.geometry, new THREE.MeshBasicMaterial(options));
							mesh.renderOrder = layerIndex * 2 + (group.textured ? 1 : 0);
							scene.add(mesh);
						});
					});
					m_viewer.setSkyScene(scene);
					skyStatus.textContent = "Ciel R4 · géométrie et textures du circuit · rendu expérimental";
				} catch (error) {
					skyStatus.textContent = "Ciel R4 non chargé : " + error.message;
				}
			}

			function rr4TextureKey(primitive) {
				return primitive.tpage + ":" + primitive.clut + ":" + (primitive.window || []).join(",");
			}

			function rr4Triangles(primitive) {
				return primitive.vertices.length === 3 ? [[0, 1, 2]] : [[0, 1, 2], [1, 3, 2]];
			}

			function rr4GeometryMesh(primitives, minimum, maximum, sprites) {
				var geometry = new THREE.Geometry();
				if (!sprites)
					Rr4Decode.assignDepthLayers(primitives);
				primitives.sort(function(a, b) {
					var first = rr4TextureKey(a), second = rr4TextureKey(b);
					return first < second ? -1 : first > second ? 1 : (a.depthLayer || 0) - (b.depthLayer || 0);
				});
				primitives.forEach(function(primitive) {
					var base = geometry.vertices.length;
					primitive.vertices.forEach(function(vertex) {
						var coordinates = sprites ?
							Rr4Decode.worldVertex(primitive.position[0] + vertex[0] / 4,
								primitive.position[1] + vertex[1] / 4, primitive.position[2] + vertex[2] / 4) :
							Rr4Decode.worldVertex(vertex[0], vertex[1], vertex[2]);
						var point = new THREE.Vector3(coordinates[0], coordinates[1], coordinates[2]);
						geometry.vertices.push(point);
						if (!sprites) {
							minimum.min(point);
							maximum.max(point);
						}
					});
					rr4Triangles(primitive).forEach(function(indices) {
						var face = new THREE.Face3(base + indices[0], base + indices[1], base + indices[2]);
						geometry.faceVertexUvs[0].push(indices.map(function(index) {
							var uv = primitive.uvs[index];
							return new THREE.Vector2((uv[0] + 0.5) / 256, (uv[1] + 0.5) / 256);
						}));
						face.vertexColors = indices.map(function(index) {
							var color = primitive.colors[index];
							return new THREE.Color(color[0] / 128, color[1] / 128, color[2] / 128);
						});
						geometry.faces.push(face);
					});
				});
				geometry.computeFaceNormals();
				geometry.computeVertexNormals();
				geometry.computeBoundingSphere();
				var mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
					color: 0xffffff,
					side: THREE.DoubleSide
				}));
				mesh.userData.rr4Primitives = primitives;
				if (sprites)
					mesh.userData.rr4Sprites = primitives;
				return mesh;
			}

			function syncRr4FlyButton() {
				var button = document.getElementById("rr4FlyToggle");
				var active = m_viewer.rr4Fly && m_viewer.rr4Fly.active;
				button.disabled = !m_viewer.rr4Fly;
				button.textContent = active ? "Arrêter le fly-through" : "Démarrer le fly-through";
				button.setAttribute("aria-pressed", active ? "true" : "false");
			}

			function updateRr4FlySettings() {
				var speed = Number(document.getElementById("rr4FlySpeed").value);
				var height = Number(document.getElementById("rr4FlyHeight").value);
				document.getElementById("rr4FlySpeedValue").textContent = speed;
				document.getElementById("rr4FlyHeightValue").textContent = height;
				if (m_viewer.rr4Fly)
					m_viewer.configureRr4Fly(speed, height, document.getElementById("rr4FlyDirection").value);
			}

			function renderRr4Course(courseId) {
				var courseData = Rr4Decode.parseCourse(Rr4Decode.extract(m_buffer, m_rr4Resources, courseId * 2 + 1));
				var routeData = Rr4Decode.parseTrackResource(Rr4Decode.extract(m_buffer, m_rr4Resources, Rr4Decode.trackResourceBase + courseId));
				var samples = courseData.samples;
				if (routeData.sampleCount !== samples.length)
					throw new Error("Le nombre d'échantillons du circuit ne correspond pas à sa ressource de tracé.");
				m_viewer.setRr4FlyPath(samples);
				syncRr4FlyButton();
				var geometry = new THREE.Geometry();
				var minimum = new THREE.Vector3(Infinity, Infinity, Infinity);
				var maximum = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
				function addVertex(sample, edge) {
					var coordinates = Rr4Decode.worldVertex(
						sample.x + edge[0],
						sample.height / 4,
						sample.z + edge[1]
					);
					var point = new THREE.Vector3(coordinates[0], coordinates[1], coordinates[2]);
					geometry.vertices.push(point);
					minimum.min(point);
					maximum.max(point);
				}
				var textureDistance = 0;
				for (var index = 0; index < samples.length; index++) {
					var current = samples[index];
					var next = samples[(index + 1) % samples.length];
					var base = geometry.vertices.length;
					var currentV = textureDistance / 512;
					textureDistance += Math.max(0, current.segmentLength);
					var nextV = textureDistance / 512;
					addVertex(current, current.right);
					addVertex(current, current.left);
					addVertex(next, next.right);
					addVertex(next, next.left);
					geometry.faces.push(new THREE.Face3(base, base + 1, base + 2));
					geometry.faces.push(new THREE.Face3(base + 1, base + 3, base + 2));
					geometry.faceVertexUvs[0].push([
						new THREE.Vector2(0, currentV),
						new THREE.Vector2(1, currentV),
						new THREE.Vector2(0, nextV)
					]);
					geometry.faceVertexUvs[0].push([
						new THREE.Vector2(1, currentV),
						new THREE.Vector2(1, nextV),
						new THREE.Vector2(0, nextV)
					]);
				}
				geometry.computeFaceNormals();
				geometry.computeVertexNormals();
				geometry.computeBoundingSphere();
				var mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
					color: 0x777d7d,
					side: THREE.DoubleSide
				}));
				mesh.userData.rr4Road = true;
				var group = new THREE.Object3D();
				group.add(mesh);
				var decorMesh = rr4GeometryMesh(courseData.decorations, minimum, maximum, false);
				var spriteMesh = rr4GeometryMesh(courseData.sprites, minimum, maximum, true);
				group.add(decorMesh);
				group.add(spriteMesh);
				group.userData.rr4TextureBuffer = Rr4Decode.extract(m_buffer, m_rr4Resources, courseId * 2);
				group.userData.rr4Ambient = courseData.ambient;
				group.userData.minimum = minimum.clone();
				group.userData.maximum = maximum.clone();
				var triangleCount = courseData.decorations.filter(function(primitive) { return primitive.vertices.length === 3; }).length;
				group.userData.summary = "Ridge Racer Type 4 · Circuit " + (courseId + 1) +
					" · " + samples.length + " échantillons · géométrie fixe : " +
					(courseData.decorations.length - triangleCount) + " quads · " + triangleCount +
					" triangles · " + courseData.sprites.length + " sprites";
				if (m_sourceType === "rr4")
					disposeRr4Meshes();
				if (m_object)
					m_viewer.remove(m_object);
				m_object = group;
				m_triangleObjects = [mesh, decorMesh, spriteMesh];
				m_viewer.rr4BillboardMesh = spriteMesh;
				m_viewer.scene.add(group);
				m_viewer.fitToBounds(minimum, maximum);
				document.getElementById("rr4Status").textContent = group.userData.summary +
					" · visibilité non décodée ; objets de piste exclus.";
				document.getElementById("rr4Ambient").value = "#" + courseData.ambient.map(function(channel) {
					return channel.toString(16).padStart(2, "0");
				}).join("");
				m_viewer.renderer.setClearColor(document.getElementById("rr4Ambient").value);
				document.getElementById("rr4AmbientSource").textContent = "Valeur native : RGB(" + courseData.ambient.join(", ") + ") · première entrée";
				applyRr4RenderMode();
				loadRr4Sky(courseData.sky, group.userData.rr4TextureBuffer);
			}

			function disposeRr4Meshes() {
				m_viewer.rr4BillboardMesh = null;
				m_rr4Textures.forEach(function(texture) { texture.dispose(); });
				m_rr4Textures = [];
				m_triangleObjects.forEach(function(mesh) {
					disposeMeshMaterial(mesh.material);
				});
			}

			function updateRr4Ambient() {
				if (!m_object || !m_object.userData.rr4Ambient)
					return;
				var enabled = document.getElementById("renderMode").value === "textured" &&
					document.getElementById("rr4AmbientEnabled").checked;
				var value = document.getElementById("rr4Ambient").value;
				m_viewer.renderer.setClearColor(value);
				var ambient = enabled ? [1, 3, 5].map(function(offset) {
					return parseInt(value.slice(offset, offset + 2), 16);
				}) : [0, 0, 0];
				m_triangleObjects.forEach(function(decor) {
					if (!decor.userData.rr4Primitives)
						return;
					var faceIndex = 0;
					decor.userData.rr4Primitives.forEach(function(primitive) {
						rr4Triangles(primitive).forEach(function(indices) {
							var face = decor.geometry.faces[faceIndex++];
							indices.forEach(function(vertex, corner) {
								var source = primitive.colors[vertex];
								face.vertexColors[corner].setRGB(
									Math.min(255, source[0] + ambient[0]) / 128,
									Math.min(255, source[1] + ambient[1]) / 128,
									Math.min(255, source[2] + ambient[2]) / 128
								);
							});
						});
					});
					decor.geometry.colorsNeedUpdate = true;
				});
			}

			function updateRr4RoadVisibility() {
				m_rr4RoadOverride = document.getElementById("rr4RoadVisible").checked;
				m_triangleObjects.forEach(function(mesh) {
					if (mesh.userData.rr4Road)
						mesh.visible = m_rr4RoadOverride;
				});
			}

			function applyRr4RenderMode() {
				var mode = document.getElementById("renderMode").value;
				var createdTextures = [];
				var textured = [];
				var createdMaterials = [];
				var description = mode === "wireframe" ? "Wireframe" : "Shaded · couleurs des primitives sans éclairage";
				if (mode === "textured") {
					try {
						if (!m_object || !m_object.userData.rr4TextureBuffer)
							throw new Error("Charge d'abord un circuit R4.");
						var vram = MapVram.loadRr4(m_object.userData.rr4TextureBuffer);
						var cache = new Map();
						var matched = 0, missing = 0;
						m_triangleObjects.forEach(function(decor) {
							if (!decor.userData.rr4Primitives)
								return;
							var materials = [], materialIndices = new Map(), faceMaterials = [];
							decor.userData.rr4Primitives.forEach(function(primitive) {
								var key = rr4TextureKey(primitive);
								var layer = primitive.depthLayer || 0;
								var materialKey = key + ":" + layer;
								if (!cache.has(key)) {
									var page = MapVram.page(vram, primitive.tpage, primitive.clut, primitive.window);
									var texture = new THREE.DataTexture(page.pixels, 256, 256, THREE.RGBAFormat, THREE.UnsignedByteType);
									texture.magFilter = THREE.NearestFilter;
									texture.minFilter = THREE.NearestFilter;
									texture.generateMipmaps = false;
									texture.flipY = false;
									texture.needsUpdate = true;
									createdTextures.push(texture);
									cache.set(key, { page: page, texture: texture });
								}
								var entry = cache.get(key);
								if (!materialIndices.has(materialKey)) {
									materialIndices.set(materialKey, materials.length);
									// Four depth units per layer avoid flickering in the tested views.
									var material = new THREE.MeshBasicMaterial({
										map: entry.texture, side: decor.userData.rr4Sprites ? THREE.DoubleSide : THREE.BackSide,
										alphaTest: 0.5, vertexColors: THREE.VertexColors,
										polygonOffset: layer > 0, polygonOffsetUnits: -4 * layer
									});
									materials.push(material);
									createdMaterials.push(material);
								}
								if (MapVram.covered(entry.page, primitive.uvs))
									matched++;
								else
									missing++;
								rr4Triangles(primitive).forEach(function() { faceMaterials.push(materialIndices.get(materialKey)); });
							});
							textured.push({ mesh: decor, materials: materials, faceMaterials: faceMaterials });
						});
						description = "Textures TIM et couleurs R4 · " + matched + " primitives couvertes · " + missing +
							" incomplètes (magenta) · visibilité et transparence STP non émulées";
					} catch (error) {
						createdTextures.forEach(function(texture) { texture.dispose(); });
						createdMaterials.forEach(function(material) { material.dispose(); });
						document.getElementById("rr4RenderStatus").textContent = error.message;
						setStatus(error.message, true);
						return;
					}
				}
				m_rr4Textures.forEach(function(texture) { texture.dispose(); });
				m_rr4Textures = createdTextures;
				var roadVisible = m_rr4RoadOverride === null ? mode !== "textured" : m_rr4RoadOverride;
				document.getElementById("rr4RoadVisible").checked = roadVisible;
				m_triangleObjects.forEach(function(mesh) {
					disposeMeshMaterial(mesh.material);
					mesh.visible = !mesh.userData.rr4Road || roadVisible;
					var textureSet = textured.find(function(entry) { return entry.mesh === mesh; });
					if (mode === "wireframe") {
						mesh.material = new THREE.MeshBasicMaterial({
							color: 0xd8e5e3, wireframe: true, side: THREE.DoubleSide
						});
					} else if (textureSet) {
						mesh.geometry.faces.forEach(function(face, index) {
							face.materialIndex = textureSet.faceMaterials[index];
						});
						mesh.geometry.uvsNeedUpdate = true;
						mesh.geometry.groupsNeedUpdate = true;
						mesh.geometry.__directGeometry = undefined;
						mesh.material = new THREE.MultiMaterial(textureSet.materials);
					} else if (mesh.userData.rr4Primitives && !mesh.userData.rr4Sprites) {
						var materials = [], materialIndices = new Map(), faceIndex = 0;
						mesh.userData.rr4Primitives.forEach(function(primitive) {
							var layer = primitive.depthLayer;
							if (!materialIndices.has(layer)) {
								materialIndices.set(layer, materials.length);
								materials.push(new THREE.MeshBasicMaterial({
									color: 0x808080, vertexColors: THREE.VertexColors, side: THREE.BackSide,
									polygonOffset: layer > 0, polygonOffsetUnits: -4 * layer
								}));
							}
							rr4Triangles(primitive).forEach(function() {
								mesh.geometry.faces[faceIndex++].materialIndex = materialIndices.get(layer);
							});
						});
						mesh.geometry.groupsNeedUpdate = true;
						mesh.geometry.__directGeometry = undefined;
						mesh.material = new THREE.MultiMaterial(materials);
					} else {
						mesh.material = mesh.userData.rr4Road ?
							new THREE.MeshBasicMaterial({ color: 0xc8ccce, side: THREE.DoubleSide }) :
							// Vertex colors are scaled by 1/128 for PS1 texture modulation.
							new THREE.MeshBasicMaterial({ color: 0x808080, vertexColors: THREE.VertexColors, side: THREE.DoubleSide });
					}
				});
				updateRr4Ambient();
				document.getElementById("rr4RenderStatus").textContent = description;
				if (m_object && m_object.userData.summary)
					setStatus(m_object.userData.summary + " · " + description, false);
			}

			function loadRr4Course() {
				try {
					if (!m_buffer || !m_rr4Resources)
						throw new Error("Charge d'abord l'archive R4.BIN.");
					var courseId = Number(document.getElementById("course").value);
					if (!Number.isInteger(courseId) || courseId < 0 || courseId >= Rr4Decode.courseCount)
						throw new Error("L'indice du circuit doit être compris entre 0 et " + (Rr4Decode.courseCount - 1) + ".");
					renderRr4Course(courseId);
					return true;
				} catch (error) {
					document.getElementById("rr4Status").textContent = error.message;
					setStatus(error.message, true);
					return false;
				}
			}

			function extractRr4Resource() {
				try {
					if (!m_buffer || !m_rr4Resources)
						throw new Error("Charge d'abord l'archive R4.BIN.");
					var id = Number(document.getElementById("rr4ResourceId").value);
					if (!Number.isInteger(id) || id < 0 || id >= m_rr4Resources.length)
						throw new Error("L'indice de ressource doit être compris entre 0 et " + (m_rr4Resources.length - 1) + ".");
					var resource = m_rr4Resources[id];
					var blob = new Blob([Rr4Decode.extract(m_buffer, m_rr4Resources, id)], { type: "application/octet-stream" });
					var url = URL.createObjectURL(blob);
					var link = document.createElement("a");
					link.href = url;
					link.download = "R4.BIN." + String(id).padStart(5, "0");
					link.click();
					setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
					var type = resource.type === null ? "inconnu" : resource.type;
					var message = link.download + " · " + resource.size + " octets · type " + type;
					document.getElementById("rr4Status").textContent = message;
					setStatus("Ressource extraite : " + message, false);
				} catch (error) {
					document.getElementById("rr4Status").textContent = error.message;
					setStatus(error.message, true);
				}
			}

			async function loadPath(path, mode) {
				var request = ++m_sourceRequest;
				setStatus("Chargement de " + path + "...", false);
				try {
					var response = await fetch(path);
					if (!response.ok)
						throw new Error("HTTP " + response.status + " pour " + path);
					var buffer = await response.arrayBuffer();
					if (request === m_sourceRequest && mode === document.getElementById("sourceMode").value)
						await loadSource(buffer, path, request, mode);
				} catch (error) {
					if (request === m_sourceRequest)
						setStatus("Impossible de charger le circuit. " + error.message, true);
				}
			}

			function loadSelectedCourse() {
				var mode = document.getElementById("sourceMode").value;
				var course = document.getElementById("course").value;
				if (!m_courses[mode] || !m_courses[mode].some(function(entry) { return entry[0] === course; })) {
					setStatus("Circuit sélectionné invalide.", true);
					return;
				}
				saveActiveCamera();
				m_viewer.clearRr4FlyPath();
				syncRr4FlyButton();
				if (mode === "rr4" && m_sourceType === "rr4" && m_rr4Resources) {
					m_sourceRequest++;
					showCourse(mode, course, loadRr4Course);
					return;
				}
				var path = mode === "revolution" ? "ridge_racer_revolution/" + course : m_modePaths[mode];
				loadPath(path, mode);
			}

			function changeSourceMode() {
				var mode = document.getElementById("sourceMode").value;
				saveActiveCamera();
				m_activeCourse = null;
				if (m_sourceType === "rr4")
					m_lastRr4RenderMode = document.getElementById("renderMode").value;
				else if (m_sourceType)
					m_lastGenericRenderMode = document.getElementById("renderMode").value;
				m_sourceRequest++;
				m_textureRequest++;
				m_viewer.clearRr4FlyPath();
				syncRr4FlyButton();
				if (m_sourceType === "rr4")
					disposeRr4Meshes();
				m_viewer.clearSky();
				m_viewer.renderer.setClearColor(0x000000);
				document.getElementById("skyStatus").textContent = "";
				m_buffer = null;
				m_mapSectors = null;
				m_mapIndexBuffer = null;
				m_revolutionVram = null;
				m_revolutionBuildings = null;
				m_rr4Resources = null;
				m_sourceType = "";
				if (m_object)
					m_viewer.remove(m_object);
				m_object = null;
				m_triangleObjects = [];
				if (m_tmsTexture) {
					m_tmsTexture.dispose();
					m_tmsTexture = null;
				}
				m_mapTextures.forEach(function(texture) { texture.dispose(); });
				m_mapTextures = [];
				var courses = m_courses[mode];
				var courseSelect = document.getElementById("course");
				setSelectOptions(courseSelect, courses, m_initialCourse || courses[0][0]);
				m_initialCourse = null;
				courseSelect.disabled = courses.length === 1;
				var renderModes = mode === "rr4" ?
					[["wireframe", "Wireframe"], ["shaded", "Shaded"], ["textured", "Texturé · expérimental"]] :
					[["wireframe", "Wireframe"], ["blocks", "Couleur par bloc"], ["sun", "Shadé · soleil"],
						["vertex", "Vertex color · calculé"], ["texture", "Texturé · expérimental"],
						["textureSun", "Texturé · soleil"]];
				if (mode === "map" || mode === "revolution")
					m_lastGenericRenderMode = "texture";
				setSelectOptions(document.getElementById("renderMode"), renderModes,
					mode === "rr4" ? m_lastRr4RenderMode : m_lastGenericRenderMode);
				document.getElementById("rr4RawControls").hidden = mode !== "rr4";
				document.getElementById("rr4Status").hidden = mode !== "rr4";
				document.getElementById("mapWarning").hidden = mode !== "map" && mode !== "revolution";
				document.getElementById("mapWarning").textContent = mode === "revolution" ?
					"Placement depuis la grille du circuit. Certaines surfaces et variantes peuvent se superposer." :
					"Placement des sections depuis IDX.HED. Certaines surfaces et variantes du circuit peuvent se superposer.";
				document.getElementById("buildingStatus").textContent = "";
				document.getElementById("buildingStatus").hidden = mode !== "map" && mode !== "revolution";
				document.getElementById("cameraControls").hidden = false;
				document.getElementById("rr4FlyControls").hidden = mode !== "rr4" && mode !== "map" && mode !== "revolution";
				document.getElementById("flyStatus").textContent = "";
				document.getElementById("rr4RenderOptions").hidden = mode !== "rr4";
				document.getElementById("rr4Ambient").value = "#000000";
				document.getElementById("rr4AmbientSource").textContent = "Charge un circuit pour lire sa couleur ambiante.";
				document.getElementById("mdlTextureControls").hidden = true;
				document.getElementById("mdlPlaneControls").hidden = true;
				document.getElementById("textureStatus").textContent = "";
				document.getElementById("rr4RenderStatus").textContent = "";
				document.getElementById("rr4Status").textContent = "";
				loadSelectedCourse();
			}

			function start() {
				var container = document.getElementById("container");
				m_viewer = new Sceneview("container", container.clientWidth, container.clientHeight || window.innerHeight);
				m_viewer.controls.addEventListener("change", scheduleCameraSave);
				window.addEventListener("pagehide", saveActiveCamera);
				setInterval(function() {
					if (m_viewer.rr4Fly && m_viewer.rr4Fly.active)
						saveActiveCamera();
				}, 1000);
				var storedSelection = readStoredSelection();
				if (storedSelection) {
					document.getElementById("sourceMode").value = storedSelection.mode;
					m_initialCourse = storedSelection.course;
				}
				document.getElementById("sourceMode").addEventListener("change", changeSourceMode);
				document.getElementById("course").addEventListener("change", loadSelectedCourse);
				document.getElementById("rr4Extract").addEventListener("click", extractRr4Resource);
				document.getElementById("topView").addEventListener("click", function() {
					if (!m_object || !m_object.userData.minimum)
						return setStatus("Charge un circuit avant de cadrer la vue.", true);
					m_viewer.stopRr4Fly();
					syncRr4FlyButton();
					m_viewer.fitTopDownToBounds(m_object.userData.minimum, m_object.userData.maximum);
				});
				document.getElementById("rr4FlyToggle").addEventListener("click", function() {
					try {
						if (m_viewer.rr4Fly && m_viewer.rr4Fly.active) {
							m_viewer.stopRr4Fly();
						} else {
							m_viewer.startRr4Fly(
								Number(document.getElementById("rr4FlySpeed").value),
								Number(document.getElementById("rr4FlyHeight").value),
								document.getElementById("rr4FlyDirection").value
							);
						}
						syncRr4FlyButton();
					} catch (error) {
						setStatus(error.message, true);
					}
				});
				["rr4FlySpeed", "rr4FlyHeight", "rr4FlyDirection"].forEach(function(id) {
					document.getElementById(id).addEventListener("input", updateRr4FlySettings);
				});
				document.addEventListener("visibilitychange", function() {
					if (document.hidden)
						saveActiveCamera();
					if (m_viewer.rr4Fly)
						m_viewer.rr4Fly.lastTime = null;
				});
				document.getElementById("renderMode").addEventListener("change", function() {
					if (m_sourceType === "rr4")
						applyRr4RenderMode();
					else if (m_sourceType)
						applyRenderMode();
				});
				document.getElementById("rr4RoadVisible").addEventListener("change", updateRr4RoadVisibility);
				document.getElementById("rr4Ambient").addEventListener("input", updateRr4Ambient);
				document.getElementById("rr4AmbientEnabled").addEventListener("change", updateRr4Ambient);
				document.getElementById("tmsBank").addEventListener("change", function() {
					if (document.getElementById("renderMode").value === "texture" || document.getElementById("renderMode").value === "textureSun")
						applyRenderMode();
				});
				document.getElementById("tmsImage").addEventListener("change", function() {
					if (document.getElementById("renderMode").value === "texture" || document.getElementById("renderMode").value === "textureSun")
						applyRenderMode();
				});
				document.getElementById("tmsPlane").addEventListener("change", function() {
					if (document.getElementById("renderMode").value === "texture" || document.getElementById("renderMode").value === "textureSun")
						applyRenderMode();
				});
				window.addEventListener("resize", function() {
					m_viewer.resize();
				});
				changeSourceMode();
			}

			start();
		</script>
	</body>
</html>
